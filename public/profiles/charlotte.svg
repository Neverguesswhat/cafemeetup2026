<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 80 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7eb8d4"/>
      <stop offset="100%" style="stop-color:#4a8fad"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0c8a0"/>
      <stop offset="100%" style="stop-color:#dba878"/>
    </linearGradient>
    <linearGradient id="hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c8722a"/>
      <stop offset="100%" style="stop-color:#a05520"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bg)"/>

  <!-- Body -->
  <ellipse cx="200" cy="520" rx="160" ry="80" fill="#dba878"/>
  <rect x="60" y="450" width="280" height="80" fill="#dba878"/>

  <!-- Neck -->
  <rect x="173" y="342" width="54" height="78" rx="10" fill="url(#skin)"/>

  <!-- Head -->
  <ellipse cx="200" cy="270" rx="92" ry="102" fill="url(#skin)"/>

  <!-- Hair — back and sides -->
  <ellipse cx="200" cy="195" rx="98" ry="82" fill="url(#hair)"/>
  <path d="M108 240 Q88 330 105 420 Q135 445 158 400 Q148 310 116 248 Z" fill="#c8722a"/>
  <path d="M292 240 Q312 330 295 420 Q265 445 242 400 Q252 310 284 248 Z" fill="#c8722a"/>

  <!-- Face -->
  <ellipse cx="200" cy="283" rx="86" ry="93" fill="url(#skin)"/>

  <!-- Ears -->
  <ellipse cx="114" cy="283" rx="13" ry="17" fill="#dba878"/>
  <ellipse cx="286" cy="283" rx="13" ry="17" fill="#dba878"/>

  <!-- Eyebrows — softer arch -->
  <path d="M157 246 Q173 238 191 243" stroke="#a05520" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M209 243 Q227 238 243 246" stroke="#a05520" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- Eyes — green/hazel -->
  <ellipse cx="173" cy="263" rx="16" ry="11" fill="white"/>
  <ellipse cx="227" cy="263" rx="16" ry="11" fill="white"/>
  <circle cx="175" cy="264" r="8" fill="#4a7040"/>
  <circle cx="229" cy="264" r="8" fill="#4a7040"/>
  <circle cx="178" cy="261" r="3" fill="white"/>
  <circle cx="232" cy="261" r="3" fill="white"/>

  <!-- Nose -->
  <path d="M196 272 Q192 290 187 298 Q200 303 213 298 Q208 290 204 272" fill="#c89060" opacity="0.45"/>

  <!-- Smile -->
  <path d="M180 318 Q200 332 220 318" fill="#e07870"/>
  <path d="M180 318 Q200 310 220 318" fill="#d06860"/>
  <path d="M185 318 Q200 322 215 318" stroke="#b05040" stroke-width="1.5" fill="none"/>

  <!-- Fringe / hair over forehead -->
  <path d="M112 205 Q145 162 200 158 Q255 162 288 205 Q265 185 240 190 Q220 178 200 176 Q180 178 160 190 Q135 185 112 205 Z" fill="#c8722a"/>

  <!-- Small hair strand details -->
  <path d="M150 175 Q155 190 152 205" stroke="#a05520" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M250 175 Q245 190 248 205" stroke="#a05520" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
</svg>
